<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Географія AR: Тектоніка</title>
  <style>
    /* Сучасний мінімалістичний UI */
    body { margin: 0; overflow: hidden; background: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; }
    #app-container { position: relative; width: 100vw; height: 100vh; }
    #webgl-canvas { display: block; width: 100%; height: 100%; outline: none; }
    
    #video-feed { position: absolute; bottom: 24px; right: 24px; width: 180px; border-radius: 16px; transform: scaleX(-1); border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; opacity: 0.8; }
    
    .ui-panel { position: absolute; top: 24px; left: 24px; z-index: 10; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-width: 320px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { margin: 0 0 8px 0; font-size: 1.25rem; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
    p { margin: 0 0 16px 0; font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }
    ul { margin: 0 0 16px 0; padding-left: 20px; color: #cbd5e1; font-size: 0.85rem; line-height: 1.6; }
    
    .status { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s ease; }
    .status.collision { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status.rift { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status.loading { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.js"
      }
    }
  </script>
</head>
<body>
  <div id="app-container">
    <div class="ui-panel">
      <h1>Тектонічна Лабораторія</h1>
      <p>Керуй рухом літосферних плит за допомогою власної міміки.</p>
      <ul>
        <li><b>Широко відкрий рот:</b><br>Дивергенція (Утворення океану)</li>
        <li><b>Закрий рот і зціп зуби:</b><br>Конвергенція (Ріст гір)</li>
      </ul>
      <div id="status-badge" class="status loading">Ініціалізація AI...</div>
    </div>
    
    <video id="video-feed" autoplay playsinline></video>
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
