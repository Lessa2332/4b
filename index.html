<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Географія AR: Горсти та Грабени | Розривні рухи</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 12px 20px;
            color: white;
            text-align: center;
            z-index: 20;
            border-left: 6px solid #ff5555;
            pointer-events: none;
            font-weight: 500;
        }
        #process-name { font-size: 1.8rem; font-weight: bold; letter-spacing: 1px; }
        #process-desc { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        #instruction {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            padding: 10px 18px;
            color: #ffdd99;
            font-size: 0.85rem;
            text-align: center;
            z-index: 20;
            font-family: monospace;
            pointer-events: none;
        }
        #status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #000000aa;
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 0.7rem;
            color: #0f0;
            font-family: monospace;
            z-index: 20;
            pointer-events: none;
            max-width: 50%;
            text-align: right;
        }
        #start-btn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c5f8a;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: 0.2s;
            font-family: inherit;
        }
        #start-btn:hover { background: #1e3e5a; transform: translateX(-50%) scale(1.02); }
        @media (max-width: 600px) {
            #process-name { font-size: 1.2rem; }
            #instruction { font-size: 0.65rem; top: 10px; }
            #ui { padding: 8px 16px; }
            #start-btn { padding: 8px 20px; font-size: 1rem; bottom: 80px; }
        }
        .error-msg { color: #ff8888; }
    </style>
</head>
<body>
    <div id="instruction">
        🧪 <strong>Географія AR: Розривні рухи</strong><br>
        😠 НАХМУРТЕ БРОВИ → <span style="color:#ffaa66">ГОРСТ (підняття)</span> &nbsp;|&nbsp;
        😲 ВІДКРИЙТЕ РОТА → <span style="color:#88aaff">ГРАБЕН (опускання)</span><br>
        🧭 Повертайте голову вліво/вправо – зміщуйте зону розлому
    </div>
    <div id="ui">
        <div id="process-name">⚙️ НЕЙТРАЛЬНО</div>
        <div id="process-desc">Блоки на одному рівні. Увімкніть камеру та керуйте мімікою</div>
    </div>
    <div id="status">📷 Очікуємо запуску</div>
    <button id="start-btn">🎥 Увімкнути AR та камеру</button>

    <!-- Підключення Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- Глобальні змінні Three.js ----------
        let scene, camera, renderer;
        let blocksGroup;
        let centerBlock;
        let leftBlock, rightBlock;
        let arrowUp, arrowDown;
        let centerBlockBaseY = -0.2;
        let currentVerticalOffset = 0;
        let targetVerticalOffset = 0;
        
        // Міміка
        let browIntensity = 0;
        let mouthIntensity = 0;
        let noseXNormalized = 0;
        
        // Згладжування
        let currentGroupX = 0;
        
        // Стан FaceMesh
        let faceMesh = null;
        let videoElem = null;
        let isFaceMeshActive = false;
        
        // Калібрування
        let neutralBrowDist = 0.045;
        let neutralMouthDist = 0.02;
        let calibrated = false;
        
        // Діагностика
        const statusDiv = document.getElementById('status');
        function setStatus(msg, isError = false) {
            statusDiv.innerHTML = msg;
            if (isError) statusDiv.style.color = "#ff8888";
            else statusDiv.style.color = "#aaffaa";
            console.log(msg);
        }
        
        // --- Створення 3D-сцени з блоками земної кори ---
        function createTexturedBlock(w, h, d, baseColor, posX, posY, posZ) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // геологічні шари
            ctx.strokeStyle = '#dba959';
            ctx.lineWidth = 18;
            for (let i = 1; i <= 10; i++) {
                const y = (i / 10) * canvas.height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
                ctx.fillStyle = '#b87c3a';
                ctx.fillRect(0, y-4, canvas.width, 4);
            }
            ctx.fillStyle = '#6a4a2a';
            for (let i = 0; i < 400; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1.5, 2);
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7, metalness: 0.1 });
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, material);
            mesh.position.set(posX, posY, posZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        function createArrow(direction, color) {
            const group = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 6), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 }));
            const head = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 16), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
            if (direction === 'up') {
                shaft.position.y = -0.4;
                head.position.y = 0.5;
            } else {
                shaft.position.y = 0.4;
                head.position.y = -0.5;
                head.rotation.x = Math.PI;
            }
            group.add(shaft, head);
            return group;
        }
        
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x071a3b);
            scene.fog = new THREE.FogExp2(0x071a3b, 0.01);
            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 20);
            camera.position.set(0, 1.2, 6);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Світло
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const main = new THREE.DirectionalLight(0xfff0cc, 1.2);
            main.position.set(3, 5, 2);
            main.castShadow = true;
            scene.add(main);
            const fill = new THREE.PointLight(0x5577aa, 0.4);
            fill.position.set(-2, 1, 3);
            scene.add(fill);
            
            const grid = new THREE.GridHelper(10, 20, 0x88aacc, 0x335577);
            grid.position.y = -1.1;
            grid.material.transparent = true;
            grid.material.opacity = 0.3;
            scene.add(grid);
            
            blocksGroup = new THREE.Group();
            scene.add(blocksGroup);
            
            // Розміри блоків
            const leftW = 1.7, rightW = 1.7, centerW = 1.5;
            const h = 1.2, d = 2.2;
            const leftX = -(leftW/2 + centerW/2 + 0.08);
            const rightX = (rightW/2 + centerW/2 + 0.08);
            const baseY = centerBlockBaseY;
            
            leftBlock = createTexturedBlock(leftW, h, d, '#7a6a58', leftX, baseY, 0);
            rightBlock = createTexturedBlock(rightW, h, d, '#7a6a58', rightX, baseY, 0);
            centerBlock = createTexturedBlock(centerW, h, d, '#bd9468', 0, baseY, 0);
            blocksGroup.add(leftBlock, rightBlock, centerBlock);
            
            // Лінії розломів (червоні)
            const faultMat = new THREE.LineBasicMaterial({ color: 0xff4444 });
            const lPoints = [new THREE.Vector3(-1.55, -0.8, -1.2), new THREE.Vector3(-1.55, 0.8, -1.2),
                             new THREE.Vector3(-1.55, 0.8, 1.2), new THREE.Vector3(-1.55, -0.8, 1.2), new THREE.Vector3(-1.55, -0.8, -1.2)];
            const rPoints = [new THREE.Vector3(1.55, -0.8, -1.2), new THREE.Vector3(1.55, 0.8, -1.2),
                             new THREE.Vector3(1.55, 0.8, 1.2), new THREE.Vector3(1.55, -0.8, 1.2), new THREE.Vector3(1.55, -0.8, -1.2)];
            const leftFault = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lPoints), faultMat);
            const rightFault = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rPoints), faultMat);
            blocksGroup.add(leftFault, rightFault);
            
            arrowUp = createArrow('up', 0xffaa66);
            arrowDown = createArrow('down', 0x88aaff);
            arrowUp.position.set(0, 0.5, 1.2);
            arrowDown.position.set(0, 0.5, 1.2);
            blocksGroup.add(arrowUp, arrowDown);
            arrowUp.visible = false;
            arrowDown.visible = false;
            
            // Частинки породи
            const particleCount = 600;
            const geomPart = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 6;
                positions[i*3+1] = (Math.random() - 0.5) * 1.5 - 0.3;
                positions[i*3+2] = (Math.random() - 0.5) * 4;
            }
            geomPart.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particles = new THREE.Points(geomPart, new THREE.PointsMaterial({ color: 0xccaa88, size: 0.04, transparent: true, opacity: 0.4 }));
            blocksGroup.add(particles);
        }
        
        // Оновлення вертикального зсуву блоків
        function updateBlockVertical() {
            const HORST_THR = 0.28;
            const GRABEN_THR = 0.35;
            let newTarget = 0;
            let processName = "⚙️ НЕЙТРАЛЬНО";
            let processDesc = "Блоки врівень. Змініть міміку для горсту або грабену.";
            let upVis = false, downVis = false;
            
            if (browIntensity > HORST_THR && mouthIntensity < 0.2) {
                const intens = Math.min(1, (browIntensity - HORST_THR) / 0.5);
                newTarget = 0.72 * intens;
                processName = "🏔️ ГОРСТ";
                processDesc = "Центральний блок піднявся → горст (скид)";
                upVis = true;
            } else if (mouthIntensity > GRABEN_THR && browIntensity < 0.2) {
                const intens = Math.min(1, (mouthIntensity - GRABEN_THR) / 0.5);
                newTarget = -0.8 * intens;
                processName = "🌊 ГРАБЕН";
                processDesc = "Центральний блок опустився → грабен";
                downVis = true;
            }
            
            targetVerticalOffset = newTarget;
            currentVerticalOffset += (targetVerticalOffset - currentVerticalOffset) * 0.22;
            if (Math.abs(currentVerticalOffset) < 0.005 && targetVerticalOffset === 0) currentVerticalOffset = 0;
            centerBlock.position.y = centerBlockBaseY + currentVerticalOffset;
            
            document.getElementById('process-name').innerHTML = processName;
            document.getElementById('process-desc').innerHTML = processDesc;
            const uiDiv = document.getElementById('ui');
            if (processName.includes("ГОРСТ")) uiDiv.style.borderLeftColor = "#ffaa66";
            else if (processName.includes("ГРАБЕН")) uiDiv.style.borderLeftColor = "#88aaff";
            else uiDiv.style.borderLeftColor = "#ff5555";
            
            arrowUp.visible = upVis;
            arrowDown.visible = downVis;
            if (upVis) {
                const s = 1 + Math.sin(Date.now() * 0.012) * 0.12;
                arrowUp.scale.set(s, s, s);
            }
            if (downVis) {
                const s = 1 + Math.sin(Date.now() * 0.012) * 0.12;
                arrowDown.scale.set(s, s, s);
            }
        }
        
        function updateGroupHorizontal() {
            let targetX = noseXNormalized * 1.5;
            targetX = Math.min(1.2, Math.max(-1.2, targetX));
            currentGroupX += (targetX - currentGroupX) * 0.1;
            blocksGroup.position.x = currentGroupX;
            camera.position.x += ((currentGroupX * 0.25) - camera.position.x) * 0.06;
            camera.lookAt(currentGroupX, 0.2, 0);
        }
        
        // --- MediaPipe із жорсткою обробкою помилок ---
        async function initFaceMesh() {
            try {
                setStatus("⏳ Завантаження MediaPipe...");
                // Динамічне завантаження бібліотек
                const { FaceMesh } = await import('https://cdn.skypack.dev/@mediapipe/face_mesh');
                const { Camera } = await import('https://cdn.skypack.dev/@mediapipe/camera_utils');
                
                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });
                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });
                
                faceMesh.onResults((results) => {
                    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                        const lm = results.multiFaceLandmarks[0];
                        // Обчислення показників
                        const leftBrow = lm[70], leftEye = lm[159];
                        const rightBrow = lm[300], rightEye = lm[386];
                        const browDist = (Math.abs(leftBrow.y - leftEye.y) + Math.abs(rightBrow.y - rightEye.y)) / 2;
                        const upperLip = lm[13], lowerLip = lm[14];
                        const mouthDist = Math.abs(upperLip.y - lowerLip.y);
                        const nose = lm[1];
                        const leftCheek = lm[356], rightCheek = lm[127];
                        const faceW = Math.abs(rightCheek.x - leftCheek.x);
                        let noseRel = (nose.x - leftCheek.x) / faceW;
                        noseRel = (noseRel - 0.5) * 2;
                        
                        if (!calibrated && browDist > 0.012 && mouthDist > 0.008) {
                            neutralBrowDist = browDist;
                            neutralMouthDist = mouthDist;
                            calibrated = true;
                            setStatus("✅ Калібрування завершено. Керуйте мімікою!");
                        }
                        
                        if (calibrated) {
                            browIntensity = Math.min(1, Math.max(0, (neutralBrowDist - browDist) / neutralBrowDist));
                            mouthIntensity = Math.min(1, Math.max(0, (mouthDist - neutralMouthDist) / 0.055));
                            if (mouthDist < neutralMouthDist * 0.9) mouthIntensity = 0;
                            noseXNormalized = noseRel;
                            setStatus(`😠 ${Math.round(browIntensity*100)}%  |  😲 ${Math.round(mouthIntensity*100)}%  |  🧭 ${Math.round(noseRel*100)}%`);
                        } else {
                            setStatus("🎭 Шукаємо обличчя... трішки порухайтесь");
                        }
                    } else {
                        browIntensity = 0; mouthIntensity = 0; noseXNormalized = 0;
                        setStatus("😞 Обличчя не знайдено. Станьте перед камерою");
                    }
                    updateBlockVertical();
                    updateGroupHorizontal();
                });
                
                // Запит камери
                setStatus("📷 Запит доступу до камери...");
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                if (videoElem) {
                    if (videoElem.srcObject) videoElem.srcObject.getTracks().forEach(t => t.stop());
                }
                videoElem = document.createElement('video');
                videoElem.srcObject = stream;
                videoElem.autoplay = true;
                videoElem.playsInline = true;
                await videoElem.play();
                
                const cameraUtils = new Camera(videoElem, {
                    onFrame: async () => {
                        if (faceMesh) await faceMesh.send({ image: videoElem });
                    },
                    width: 640,
                    height: 480
                });
                cameraUtils.start();
                isFaceMeshActive = true;
                setStatus("🎥 Камера працює, MediaPipe запущено");
                
                // Приховуємо кнопку
                document.getElementById('start-btn').style.display = 'none';
                
            } catch (err) {
                console.error("Помилка ініціалізації:", err);
                setStatus(`❌ Помилка: ${err.message || err}`, true);
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').textContent = "🔄 Повторити спробу";
            }
        }
        
        // Анімація Three.js
        function animate() {
            requestAnimationFrame(animate);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        // Глобальна обробка помилок
        window.addEventListener('error', (e) => {
            console.error("Глобальна помилка:", e.error);
            setStatus(`⚠️ Помилка: ${e.message}`, true);
        });
        
        // Запуск
        function startApp() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = "⏳ Запуск...";
            initFaceMesh().catch(e => {
                setStatus(`Критична помилка: ${e.message}`, true);
                btn.disabled = false;
                btn.textContent = "⚠️ Спробувати ще раз";
            });
        }
        
        // Ініціалізація 3D та кнопки
        init3D();
        animate();
        window.addEventListener('resize', () => {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        document.getElementById('start-btn').addEventListener('click', startApp);
        setStatus("Натисніть кнопку для запуску AR");
    </script>
</body>
</html>
