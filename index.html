<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Географія 7 клас: Живий розріз літосфери</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d0d11; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #video { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 112px; transform: scaleX(-1); border-radius: 8px; border: 2px solid #ffcc00; z-index: 2; opacity: 0.4; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffcc00; font-size: 1.5rem; z-index: 3; text-align: center; font-weight: bold; }
        #lesson-ui { position: absolute; top: 25px; left: 25px; z-index: 4; color: #ffffff; width: 340px; background: rgba(13, 13, 17, 0.85); padding: 15px; border-radius: 10px; border-left: 5px solid #ffcc00; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none; }
        #lesson-ui h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; }
        #lesson-ui p { margin: 5px 0; font-size: 0.85rem; color: #ccc; line-height: 1.4; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; margin-top: 5px; }
        #status { background: #555; color: #fff; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="lesson-ui">
        <h2>Географія 7 клас</h2>
        <p><b>Тема:</b> Рух літосферних плит (розріз)</p>
        <hr style="border-color:#333; margin: 10px 0;">
        <p>😠 <b>Нахмур брови</b> → Плити стикаються (гори)</p>
        <p>😮 <b>Відкрий рот</b> → Плити розходяться (рифт, магма)</p>
        <div class="status-badge" id="status">Очікування камери...</div>
    </div>

    <div id="loading">Запуск тектонічної лабораторії...</div>
    <video id="video" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script>
        const videoElement = document.getElementById('video');
        const loadingElement = document.getElementById('loading');
        const statusBadge = document.getElementById('status');
        
        // --- Ініціалізація Three.js ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d11, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -4, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Розміри сітки ---
        const gridWidth = 70;
        const gridHeight = 40;
        const count = gridWidth * gridHeight;

        const geometry = new THREE.BoxGeometry(0.9, 0.9, 3);
        const material = new THREE.MeshBasicMaterial({ vertexColors: false });
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        scene.add(mesh);

        const dummy = new THREE.Object3D();
        const initialPositions = [];
        const plateAssignment = new Int8Array(count); // 0 = ліва, 1 = права

        let idx = 0;
        for (let x = 0; x < gridWidth; x++) {
            for (let y = 0; y < gridHeight; y++) {
                const posX = (x - gridWidth / 2) * 0.95;
                const posY = (y - gridHeight / 2) * 0.95;
                initialPositions.push({ x: posX, y: posY, z: 0 });
                plateAssignment[idx] = x < gridWidth / 2 ? 0 : 1;
                idx++;
            }
        }

        // --- Магматичний шар під корою (розріз) ---
        const magmaPlaneGeometry = new THREE.PlaneGeometry(80, 40);
        const magmaPlaneMaterial = new THREE.MeshBasicMaterial({
            color: 0xff3300,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7
        });
        const magmaPlane = new THREE.Mesh(magmaPlaneGeometry, magmaPlaneMaterial);
        magmaPlane.rotation.x = -Math.PI / 2; // горизонтально
        magmaPlane.position.z = -4.5; // під плитами
        scene.add(magmaPlane);

        // --- Частинки магми (розходження) ---
        const magmaParticleCount = 400;
        const magmaGeometry = new THREE.BufferGeometry();
        const magmaPositions = new Float32Array(magmaParticleCount * 3);
        const magmaColors = new Float32Array(magmaParticleCount * 3);
        const magmaSizes = new Float32Array(magmaParticleCount);
        const magmaVelocity = new Float32Array(magmaParticleCount * 3);
        const magmaLife = new Float32Array(magmaParticleCount);
        
        for (let i = 0; i < magmaParticleCount; i++) {
            magmaPositions[i * 3] = (Math.random() - 0.5) * 20;
            magmaPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
            magmaPositions[i * 3 + 2] = Math.random() * -5;
            magmaColors[i * 3] = 1.0;
            magmaColors[i * 3 + 1] = 0.3 + Math.random() * 0.4;
            magmaColors[i * 3 + 2] = 0.0;
            magmaSizes[i] = 1.5 + Math.random() * 3;
            magmaVelocity[i * 3] = (Math.random() - 0.5) * 0.02;
            magmaVelocity[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
            magmaVelocity[i * 3 + 2] = 0.05 + Math.random() * 0.1;
            magmaLife[i] = 0;
        }
        
        magmaGeometry.setAttribute('position', new THREE.BufferAttribute(magmaPositions, 3));
        magmaGeometry.setAttribute('color', new THREE.BufferAttribute(magmaColors, 3));
        magmaGeometry.setAttribute('size', new THREE.BufferAttribute(magmaSizes, 1));
        
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(16, 16, 14, 0, 2 * Math.PI);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.strokeStyle = 'orange';
        ctx.lineWidth = 2;
        ctx.stroke();
        const particleTexture = new THREE.CanvasTexture(canvas);
        
        const magmaMaterial = new THREE.PointsMaterial({
            size: 0.6,
            map: particleTexture,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true
        });
        const magmaPoints = new THREE.Points(magmaGeometry, magmaMaterial);
        scene.add(magmaPoints);

        // --- Частинки уламків (зіткнення) ---
        const debrisParticleCount = 300;
        const debrisGeometry = new THREE.BufferGeometry();
        const debrisPositions = new Float32Array(debrisParticleCount * 3);
        const debrisColors = new Float32Array(debrisParticleCount * 3);
        const debrisSizes = new Float32Array(debrisParticleCount);
        const debrisVelocity = new Float32Array(debrisParticleCount * 3);
        const debrisLife = new Float32Array(debrisParticleCount);
        
        for (let i = 0; i < debrisParticleCount; i++) {
            debrisPositions[i * 3] = (Math.random() - 0.5) * 20;
            debrisPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
            debrisPositions[i * 3 + 2] = Math.random() * 5;
            debrisColors[i * 3] = 0.6 + Math.random() * 0.4;
            debrisColors[i * 3 + 1] = 0.6 + Math.random() * 0.4;
            debrisColors[i * 3 + 2] = 0.6 + Math.random() * 0.4;
            debrisSizes[i] = 0.8 + Math.random() * 2;
            debrisVelocity[i * 3] = (Math.random() - 0.5) * 0.05;
            debrisVelocity[i * 3 + 1] = (Math.random() - 0.5) * 0.05;
            debrisVelocity[i * 3 + 2] = 0.02 + Math.random() * 0.1;
            debrisLife[i] = Math.random() * 100;
        }
        
        debrisGeometry.setAttribute('position', new THREE.BufferAttribute(debrisPositions, 3));
        debrisGeometry.setAttribute('color', new THREE.BufferAttribute(debrisColors, 3));
        debrisGeometry.setAttribute('size', new THREE.BufferAttribute(debrisSizes, 1));
        
        const debrisMaterial = new THREE.PointsMaterial({
            size: 0.4,
            map: particleTexture,
            vertexColors: true,
            blending: THREE.NormalBlending,
            depthWrite: true,
            transparent: true
        });
        const debrisPoints = new THREE.Points(debrisGeometry, debrisMaterial);
        scene.add(debrisPoints);

        // --- Стан обличчя ---
        let faceState = {
            noseX: 0,
            mouthOpenRatio: 0,
            browDownRatio: 0, // 0 = норма, 1 = сильно нахмурені
            active: false
        };

        // --- AI Трекінг обличчя (FaceMesh) ---
        function onResults(results) {
            if (loadingElement) loadingElement.style.display = 'none';

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Ніс (1)
                const nose = landmarks[1];
                faceState.noseX = -(nose.x - 0.5) * 75;
                
                // Відкриття рота (відстань між верхньою та нижньою губою)
                const topLip = landmarks[13];
                const bottomLip = landmarks[14];
                const mouthDist = Math.sqrt(Math.pow(topLip.x - bottomLip.x, 2) + Math.pow(topLip.y - bottomLip.y, 2));
                faceState.mouthOpenRatio = Math.min(Math.max((mouthDist - 0.015) / 0.06, 0), 1);
                
                // Нахмурення брів (відстань між бровами та верхніми повіками)
                // Беремо середини брів (107 ліва, 55 права) і верхні повіки (159 праве, 145 ліве)
                const leftBrow = landmarks[107];
                const rightBrow = landmarks[55];
                const leftUpperEyelid = landmarks[145];
                const rightUpperEyelid = landmarks[159];
                
                const browMidY = (leftBrow.y + rightBrow.y) / 2;
                const eyelidMidY = (leftUpperEyelid.y + rightUpperEyelid.y) / 2;
                const browEyelidDist = eyelidMidY - browMidY; // зазвичай ~0.04-0.06, при нахмуренні зменшується
                
                // Калібрування: нейтральна відстань ~0.05, мінімальна ~0.01
                const neutralDist = 0.05;
                const minDist = 0.01;
                faceState.browDownRatio = Math.max(0, Math.min(1, (neutralDist - browEyelidDist) / (neutralDist - minDist)));
                
                faceState.active = true;

                // Статус
                if (faceState.mouthOpenRatio > 0.4) {
                    statusBadge.innerHTML = "РИФТОГЕНЕЗ (МАГМА)";
                    statusBadge.style.background = "#ff3300";
                } else if (faceState.browDownRatio > 0.3) {
                    statusBadge.innerHTML = "КОЛІЗІЯ (ГОРИ)";
                    statusBadge.style.background = "#00cc66";
                } else {
                    statusBadge.innerHTML = "Нейтральний стан";
                    statusBadge.style.background = "#555";
                }
            } else {
                faceState.active = false;
                statusBadge.innerHTML = "Обличчя поза зоною";
                statusBadge.style.background = "#555";
            }
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- Анімація ---
        const clock = new THREE.Clock();
        const col = new THREE.Color();
        let currentGap = 0;
        const maxGap = 5;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // Визначаємо режим
            const riftMode = faceState.active && faceState.mouthOpenRatio > 0.4;
            const collisionMode = faceState.active && !riftMode && faceState.browDownRatio > 0.3;
            
            // Рух плит (розходження)
            const targetGap = riftMode ? faceState.mouthOpenRatio * maxGap : 0;
            currentGap = THREE.MathUtils.lerp(currentGap, targetGap, 0.1);
            
            const faultX = faceState.active ? faceState.noseX : 0;
            
            // Оновлення блоків
            let idx = 0;
            // Переконуємось, що instanceColor існує
            if (!mesh.instanceColor) {
                const colorArray = new Float32Array(count * 3);
                mesh.instanceColor = new THREE.InstancedBufferAttribute(colorArray, 3);
            }
            const colorArray = mesh.instanceColor.array;
            
            for (let x = 0; x < gridWidth; x++) {
                for (let y = 0; y < gridHeight; y++) {
                    const block = initialPositions[idx];
                    const plate = plateAssignment[idx];
                    
                    let offsetX = 0;
                    if (plate === 0) offsetX = -currentGap / 2;
                    else offsetX = currentGap / 2;
                    
                    let posX = block.x + offsetX;
                    let posY = block.y;
                    let posZ = Math.sin(block.x * 0.05 + time * 0.5) * 0.2;
                    
                    // Кольори плит
                    if (plate === 0) col.setHex(0x1a2a3a);
                    else col.setHex(0x2d3a1a);
                    
                    if (faceState.active) {
                        const distToFault = Math.abs(posX - faultX);
                        const zoneOfInfluence = 14;
                        
                        if (distToFault < zoneOfInfluence) {
                            const factor = 1 - (distToFault / zoneOfInfluence);
                            
                            if (riftMode) {
                                // Розходження: провалля + магма
                                const sink = faceState.mouthOpenRatio * 7 * factor;
                                posZ -= sink;
                                if (factor > 0.3) {
                                    col.lerp(new THREE.Color(0xff4400), factor * faceState.mouthOpenRatio);
                                }
                            } else if (collisionMode) {
                                // Зіткнення: гори + корінь (опускання вниз)
                                const intensity = faceState.browDownRatio;
                                const mountainHeight = 9 * factor * intensity;
                                const rootDepth = 3 * factor * intensity; // корінь
                                posZ += mountainHeight - rootDepth; // одночасно вгору і вниз
                                
                                if (posZ > 3.5) {
                                    col.lerp(new THREE.Color(0xffffff), (posZ - 3.5) / 4);
                                } else if (posZ > 1.5) {
                                    col.lerp(new THREE.Color(0x888888), factor);
                                } else if (posZ < -1.5) {
                                    col.lerp(new THREE.Color(0x442222), Math.abs(posZ) / 4);
                                }
                            }
                        }
                    }
                    
                    dummy.position.set(posX, posY, posZ);
                    dummy.rotation.set(0, 0, 0);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(idx, dummy.matrix);
                    
                    colorArray[idx * 3] = col.r;
                    colorArray[idx * 3 + 1] = col.g;
                    colorArray[idx * 3 + 2] = col.b;
                    
                    idx++;
                }
            }
            
            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
            
            // Частинки магми (тільки рифт)
            if (riftMode) {
                magmaPoints.visible = true;
                const positions = magmaGeometry.attributes.position.array;
                const colors = magmaGeometry.attributes.color.array;
                const sizes = magmaGeometry.attributes.size.array;
                
                for (let i = 0; i < magmaParticleCount; i++) {
                    positions[i * 3] += magmaVelocity[i * 3];
                    positions[i * 3 + 1] += magmaVelocity[i * 3 + 1];
                    positions[i * 3 + 2] += magmaVelocity[i * 3 + 2];
                    magmaLife[i] += 0.01;
                    
                    if (positions[i * 3 + 2] > 2 || magmaLife[i] > 1.5) {
                        positions[i * 3] = faultX + (Math.random() - 0.5) * (3 + currentGap * 2);
                        positions[i * 3 + 1] = (Math.random() - 0.5) * 30;
                        positions[i * 3 + 2] = -5 - Math.random() * 3;
                        magmaVelocity[i * 3] = (Math.random() - 0.5) * 0.03;
                        magmaVelocity[i * 3 + 1] = (Math.random() - 0.5) * 0.03;
                        magmaVelocity[i * 3 + 2] = 0.04 + Math.random() * 0.12;
                        magmaLife[i] = 0;
                        
                        colors[i * 3] = 1.0;
                        colors[i * 3 + 1] = 0.2 + Math.random() * 0.5;
                        colors[i * 3 + 2] = 0.0;
                        sizes[i] = 1.5 + Math.random() * 3;
                    } else {
                        colors[i * 3 + 1] *= 0.98;
                        sizes[i] *= 0.995;
                    }
                }
                magmaGeometry.attributes.position.needsUpdate = true;
                magmaGeometry.attributes.color.needsUpdate = true;
                magmaGeometry.attributes.size.needsUpdate = true;
            } else {
                magmaPoints.visible = false;
            }
            
            // Частинки уламків (тільки колізія)
            if (collisionMode) {
                debrisPoints.visible = true;
                const positions = debrisGeometry.attributes.position.array;
                const colors = debrisGeometry.attributes.color.array;
                const sizes = debrisGeometry.attributes.size.array;
                
                for (let i = 0; i < debrisParticleCount; i++) {
                    positions[i * 3] += debrisVelocity[i * 3];
                    positions[i * 3 + 1] += debrisVelocity[i * 3 + 1];
                    positions[i * 3 + 2] += debrisVelocity[i * 3 + 2];
                    debrisLife[i] += 0.02;
                    
                    if (positions[i * 3 + 2] > 8 || debrisLife[i] > 2.0) {
                        positions[i * 3] = faultX + (Math.random() - 0.5) * (4 - currentGap);
                        positions[i * 3 + 1] = (Math.random() - 0.5) * 30;
                        positions[i * 3 + 2] = 1 + Math.random() * 2;
                        debrisVelocity[i * 3] = (Math.random() - 0.5) * 0.08;
                        debrisVelocity[i * 3 + 1] = (Math.random() - 0.5) * 0.08;
                        debrisVelocity[i * 3 + 2] = 0.02 + Math.random() * 0.15;
                        debrisLife[i] = 0;
                        
                        colors[i * 3] = 0.7 + Math.random() * 0.3;
                        colors[i * 3 + 1] = 0.7 + Math.random() * 0.3;
                        colors[i * 3 + 2] = 0.7 + Math.random() * 0.3;
                        sizes[i] = 0.5 + Math.random() * 1.8;
                    } else {
                        colors[i * 3] *= 0.995;
                        colors[i * 3 + 1] *= 0.995;
                        colors[i * 3 + 2] *= 0.995;
                        sizes[i] *= 0.998;
                    }
                }
                debrisGeometry.attributes.position.needsUpdate = true;
                debrisGeometry.attributes.color.needsUpdate = true;
                debrisGeometry.attributes.size.needsUpdate = true;
            } else {
                debrisPoints.visible = false;
            }
            
            // Підсвічування магми під час рифту
            magmaPlane.material.opacity = riftMode ? 0.9 : 0.4;
            
            // Камера слідує за носом
            if (faceState.active) {
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, faceState.noseX * 0.2, 0.05);
            }
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.projectionMatrix.makePerspective(55, camera.aspect, 0.1, 1000);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
