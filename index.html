<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Рівень 5: Активація | Квест-гра</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:#1a56ff; --dark:#0a1a6e; --gold:#FFE600;
      --green:#39FF14; --pink:#ff3366; --white:#ffffff;
      --font:'Nunito',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:var(--font);background:radial-gradient(ellipse at 60% 10%,var(--blue) 0%,var(--dark) 70%);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;overflow-x:hidden;}
    h1{font-weight:900;font-size:26px;color:var(--gold);text-align:center;margin-bottom:6px;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.3);}
    .sub{text-align:center;font-size:14px;font-weight:700;opacity:.85;margin-bottom:18px;}
    .box{background:#1a4aff;border:5px solid var(--white);border-radius:36px;padding:26px 20px;max-width:420px;width:100%;box-shadow:0 16px 0 rgba(0,0,50,.4);text-align:center;}
    .lbl{display:block;font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;margin-bottom:7px;text-align:left;}
    .inp{width:100%;padding:14px 18px;font-family:var(--font);font-size:17px;font-weight:800;border:4px solid var(--white);border-radius:22px;background:#0033bb;color:var(--white);text-align:center;outline:none;margin-bottom:16px;}
    .inp::placeholder{color:rgba(255,255,255,.4);}
    .vibe{display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);padding:8px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.2);cursor:pointer;margin-bottom:16px;}
    .vibe-lbl{font-size:12px;font-weight:800;text-transform:uppercase;}
    .toggle{width:40px;height:22px;background:var(--pink);border-radius:11px;position:relative;transition:.3s;}
    .toggle-h{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.3);}
    .vibe.on .toggle{background:var(--green);}
    .vibe.on .toggle-h{left:21px;}
    .scan{width:160px;height:160px;margin:6px auto 10px;border:6px solid var(--green);border-radius:50%;position:relative;cursor:pointer;background:radial-gradient(circle,#0033aa 40%,#001166 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(57,255,20,.4);}
    .scan.off{opacity:.35;border-color:#666;cursor:not-allowed;pointer-events:none;}
    .scan-line{position:absolute;left:0;width:100%;height:6px;background:var(--green);box-shadow:0 0 14px var(--green);display:none;animation:scanAnim 2s linear infinite;z-index:5;}
    @keyframes scanAnim{0%{top:0%}50%{top:100%}100%{top:0%}}
    .scan.go .scan-line{display:block;}
    .scan.go{box-shadow:0 0 40px var(--green);}
    .fp{width:60%;height:60%;pointer-events:none;}
    .hint{font-size:13px;font-weight:800;margin-top:8px;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    #msg{font-size:16px;font-weight:900;margin:14px 0 6px;min-height:22px;line-height:1.4;}
    .btns{display:flex;gap:10px;justify-content:center;margin-top:12px;}
    .btn{padding:13px 24px;border:4px solid var(--white);color:var(--white);font-size:15px;font-weight:900;text-transform:uppercase;cursor:pointer;border-radius:22px;text-decoration:none;font-family:var(--font);}
    .btn-red{background:var(--pink);box-shadow:0 5px 0 #991133;}
    .btn-red:active{transform:translateY(4px);box-shadow:0 1px 0 #991133;}
    .btn-gold{background:var(--gold);color:#1a1a00;box-shadow:0 5px 0 #cda500;}
    .btn-gold:active{transform:translateY(4px);box-shadow:0 1px 0 #cda500;}
  </style>
</head>
<body>
  <h1>🚀 РІВЕНЬ 5: АКТИВОВАНО!</h1>
  <div class="sub">Вхід у базу даних п'ятикласників</div>

  <div class="box">
    <label class="lbl" for="uname">Введи своє ім'я</label>
    <input class="inp" id="uname" placeholder="Наприклад: Ян або Максим" oninput="chk()">

    <div class="vibe" id="vib" onclick="toggleV()">
      <span class="vibe-lbl" id="vlbl">📳 Вібрація: OFF</span>
      <div class="toggle"><div class="toggle-h"></div></div>
    </div>

    <div class="scan off" id="scan"
         onmousedown="startS(event)" onmouseup="stopS(event)" onmouseleave="stopS(event)"
         ontouchstart="startS(event)" ontouchend="stopS(event)">
      <div class="scan-line"></div>
      <svg class="fp" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 2.22.73 4.28 1.97 5.94.29.39.84.47 1.23.18.39-.29.47-.84.18-1.23A8.24 8.24 0 013.75 12C3.75 7.44 7.44 3.75 12 3.75c4.56 0 8.25 3.69 8.25 8.25 0 1.01-.18 2-.52 2.93-.15.43.07.9.5 1.05.43.15.9-.07 1.05-.5C21.75 14.22 22 12.88 22 12c0-5.52-4.48-10-10-10z" fill="#39FF14"/>
        <path d="M12 6C8.69 6 6 8.69 6 12c0 1.46.52 2.81 1.39 3.86.28.34.8.38 1.14.1.34-.28.38-.8.1-1.14A4.74 4.74 0 017.5 12C7.5 9.51 9.51 7.5 12 7.5c2.49 0 4.5 2.01 4.5 4.5 0 1.41-.68 2.65-1.71 3.42-.37.28-.44.8-.16 1.17.28.37.8.44 1.17.16C17.18 15.72 18 14.07 18 12c0-3.31-2.69-6-6-6z" fill="#39FF14"/>
        <circle cx="12" cy="12" r="2" fill="#39FF14"/>
      </svg>
    </div>
    <div class="hint" id="hint" style="color:var(--white)">Заповни поле з ім'ям вгорі 👆</div>
    <div id="msg"></div>
    <div class="btns">
      <button class="btn btn-red" id="rBtn" style="display:none" onclick="reset()">Ще раз</button>
      <a href="game.html" class="btn btn-gold" id="goBtn" style="display:none">СТАРТ ГРИ 🎮</a>
    </div>
  </div>

  <audio id="snd" preload="auto"><source src="https://assets.mixkit.co/sfx/download/mixkit-scanning-sci-fi-alarm-905.wav" type="audio/wav"></audio>

  <script>
    const SKILLS=[
      {name:'🦾 Мега-мозок математики',бонус:'Швидкість розв\'язування задач x2!'},
      {name:'🧭 Майстер географічних мандрів',бонус:'Ніколи не заблукаєш у кабінетах!'},
      {name:'⚡ Генератор геніальних ідей',бонус:'Твої проєкти здивують усю школу!'},
      {name:'🛡️ Захисник класної дружби',бонус:'Твоя суперсила — єднати друзів!'},
      {name:'🚀 Космічний лідер',бонус:'Упевнено ведеш команду за собою!'},
      {name:'🎨 Креативний ніндзя',бонус:'Вмієш малювати шедеври на берегах!'},
      {name:'📚 Хранитель шкільних таємниць',бонус:'Знаєш відповіді на всі запитання!'},
      {name:'🎭 Суперзірка перерв',бонус:'Вмієш піднімати настрій усьому класу!'}
    ];
    let useV=false, scanning=false, timer=null;
    const scan=document.getElementById('scan');
    const hint=document.getElementById('hint');
    const msg=document.getElementById('msg');
    const snd=document.getElementById('snd');

    function chk(){
      const ok=document.getElementById('uname').value.trim().length>=2;
      scan.classList.toggle('off',!ok);
      hint.textContent=ok?'👆 Притисни й ТРИМАЙ для сканування!':'Заповни поле з іменем вгорі 👆';
      hint.style.color=ok?'var(--green)':'var(--white)';
    }
    function toggleV(){
      useV=!useV;
      document.getElementById('vib').classList.toggle('on',useV);
      document.getElementById('vlbl').textContent='📳 Вібрація: '+(useV?'ON':'OFF');
      if(useV&&navigator.vibrate)navigator.vibrate(40);
    }
    function startS(e){
      e.preventDefault();
      if(scan.classList.contains('off')||scanning)return;
      scanning=true;
      scan.classList.add('go');
      msg.innerHTML='<span style="font-size:14px;font-weight:700">🧬 Сканування... аналіз скілів</span>';
      hint.textContent='ТРИМАЙ, НЕ ВІДПУСКАЙ! ⏳';
      hint.style.color='var(--gold)';
      document.getElementById('uname').disabled=true;
      if(useV&&navigator.vibrate)navigator.vibrate(60);
      snd.currentTime=0; snd.play().catch(()=>{});
      timer=setTimeout(()=>{
        if(!scanning)return;
        scanning=false;
        scan.classList.remove('go');
        snd.pause(); snd.currentTime=0;
        const sk=SKILLS[Math.floor(Math.random()*SKILLS.length)];
        const nm=document.getElementById('uname').value.trim();
        localStorage.setItem('pysanka_student_name',nm);
        localStorage.setItem('pysanka_student_skill',sk.name);
        localStorage.setItem('pysanka_student_bonus',sk.бонус);
        msg.innerHTML=`<span style="color:var(--green)">✅ ВЕРИФІКОВАНО!</span><br><span style="font-size:13px;font-weight:700">${nm} — в системі п'ятикласників</span>`;
        hint.textContent='🚀 Доступ відкрито!';
        hint.style.color='var(--green)';
        document.getElementById('rBtn').style.display='inline-block';
        document.getElementById('goBtn').style.display='inline-block';
        if(useV&&navigator.vibrate)navigator.vibrate([150,80,150,80,300]);
      },3000);
    }
    function stopS(e){
      e.preventDefault();
      if(!scanning)return;
      scanning=false;
      clearTimeout(timer);
      scan.classList.remove('go');
      snd.pause(); snd.currentTime=0;
      if(useV&&navigator.vibrate)navigator.vibrate([60,40,60]);
      msg.innerHTML='<span style="color:var(--pink)">❌ Сканування перервано!</span>';
      hint.textContent='Притисни й тримай до кінця! 👆';
      hint.style.color='var(--pink)';
      document.getElementById('uname').disabled=false;
    }
    function reset(){
      scanning=false; clearTimeout(timer);
      scan.classList.remove('go');
      msg.innerHTML='';
      document.getElementById('rBtn').style.display='none';
      document.getElementById('goBtn').style.display='none';
      document.getElementById('uname').disabled=false;
      document.getElementById('uname').value='';
      chk();
    }
  </script>
</body>
</html>
