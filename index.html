<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Еко-Симулятор: Вплив Лісу 🌍</title>
    <style>
        :root {
            --bg-color: #1e272e;
            --text-color: #d2dae2;
            --card-bg: rgba(30, 39, 46, 0.85);
            --accent-green: #0be881;
            --accent-red: #ff3f34;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(180deg, #4bcffa 0%, #0fbcf9 100%);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            transition: background 1s ease;
        }

        /* Дашборд з показниками */
        header {
            background: rgba(15, 20, 25, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .metrics-grid {
            display: flex;
            gap: 20px;
        }

        .metric {
            background: #2d3436;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 4px solid #fff;
        }

        .metric h3 { margin: 0; font-size: 0.9rem; color: #b2bec3; }
        .metric span { font-size: 1.5rem; font-weight: bold; }
        
        #aqi-card { border-left-color: var(--accent-green); }
        #temp-card { border-left-color: #ffdd59; }
        #bio-card { border-left-color: #ef5777; }

        /* Науковий блок (Факти) */
        .fact-panel {
            position: absolute;
            top: 100px;
            left: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-green);
            font-size: 0.95rem;
            line-height: 1.4;
            display: none;
            z-index: 50;
            animation: fadeIn 0.3s ease;
        }

        /* Ігрове поле */
        .play-field {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60vh;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #27ae60;
            transition: background 1s ease;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            gap: 15px;
        }

        .tree {
            font-size: 5rem;
            transform-origin: bottom;
            animation: grow 0.5s ease-out;
            cursor: pointer;
            position: relative;
        }

        .tree:hover::after {
            content: '🪓 Зрубати';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3f34;
            color: white;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Кнопки керування */
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .btn-plant {
            background: var(--accent-green);
            color: #1e272e;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(11, 232, 129, 0.4);
            transition: transform 0.1s;
        }
        .btn-plant:active { transform: scale(0.95); }

        /* Забруднення */
        .pollution-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0);
            pointer-events: none;
            transition: background 1s ease;
            z-index: 10;
        }

        @keyframes grow {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="pollution-layer" id="smog"></div>

    <header>
        <h2>🌍 Моніторинг Екосистеми</h2>
        <div class="metrics-grid">
            <div class="metric" id="aqi-card">
                <h3>Індекс якості повітря (AQI)</h3>
                <span id="val-aqi">20</span> <span id="status-aqi">🟢 (Добре)</span>
            </div>
            <div class="metric" id="temp-card">
                <h3>Локальна Температура</h3>
                <span id="val-temp">22</span>°C 🌡️
            </div>
            <div class="metric" id="bio-card">
                <h3>Тварини в регіоні</h3>
                <span id="val-bio">15</span> 🦊
            </div>
        </div>
    </header>

    <div class="fact-panel" id="fact-box">
        <strong>📚 Науковий факт:</strong>
        <p id="fact-text"></p>
    </div>

    <div class="play-field">
        <div class="ground" id="forest"></div>
    </div>

    <div class="controls">
        <button class="btn-plant" onclick="plantTree()">🌱 Висадити гектар лісу</button>
    </div>

    <script>
        // Базові показники
        let state = {
            trees: 3,
            co2Emissions: 100, // Базові викиди від міст/заводів
            baseTemp: 26,      // Температура без дерев
            maxAnimals: 25
        };

        const facts = [
            "Одне доросле дерево виділяє достатньо кисню для дихання 3 людей протягом року.",
            "Дерева працюють як кондиціонери: випаровування вологи з листя може знизити температуру навколо на 2-4°C.",
            "Коренева система дерев запобігає ерозії ґрунту і затримує воду, рятуючи від посух.",
            "Ліси є домом для 80% сухопутних видів тварин. Без дерев вони втрачають середовище існування.",
            "Листя дерев затримує дрібнодисперсний пил (PM2.5), який є критично небезпечним для легень людини."
        ];

        function updateSystem() {
            // 1. Розрахунок AQI (чим більше дерев, тим менше забруднення від базового CO2)
            let absorbedCO2 = state.trees * 20;
            let currentPollution = Math.max(5, state.co2Emissions - absorbedCO2);
            let aqiElement = document.getElementById('val-aqi');
            let aqiStatus = document.getElementById('status-aqi');
            let aqiCard = document.getElementById('aqi-card');
            
            aqiElement.innerText = currentPollution;
            
            if(currentPollution < 40) {
                aqiStatus.innerText = "🟢 (Чисто)";
                aqiCard.style.borderLeftColor = "#0be881";
                document.getElementById('smog').style.background = "rgba(45, 52, 54, 0)";
                document.body.style.background = "linear-gradient(180deg, #4bcffa 0%, #0fbcf9 100%)";
            } else if(currentPollution < 80) {
                aqiStatus.innerText = "🟡 (Помірно)";
                aqiCard.style.borderLeftColor = "#ffdd59";
                document.getElementById('smog').style.background = "rgba(45, 52, 54, 0.4)";
                document.body.style.background = "linear-gradient(180deg, #7f8fa6 0%, #718093 100%)";
            } else {
                aqiStatus.innerText = "🔴 (Небезпечно!)";
                aqiCard.style.borderLeftColor = "#ff3f34";
                document.getElementById('smog').style.background = "rgba(45, 52, 54, 0.85)";
                document.body.style.background = "linear-gradient(180deg, #2f3640 0%, #353b48 100%)";
            }

            // 2. Температура (Кожне дерево знижує температуру на 1.5 градуса)
            let currentTemp = state.baseTemp - (state.trees * 1.5);
            document.getElementById('val-temp').innerText = currentTemp.toFixed(1);

            // 3. Біорізноманіття (Тваринам потрібен ліс і нормальна температура)
            let animals = 0;
            if (state.trees > 0 && currentTemp < 25) {
                animals = Math.min(state.maxAnimals, state.trees * 5);
            }
            document.getElementById('val-bio').innerText = animals;
            
            // Смерть екосистеми
            if(state.trees === 0) {
                document.getElementById('forest').style.background = "#e1b12c"; // суха земля
                showFact("🚨 КАТАСТРОФА: Без дерев ґрунт перетворюється на пустелю, температура стрімко зростає, а всі тварини мігрують або гинуть.");
            } else {
                document.getElementById('forest').style.background = "#27ae60"; // зелена трава
            }
        }

        function renderTrees() {
            const forest = document.getElementById('forest');
            forest.innerHTML = '';
            for(let i=0; i<state.trees; i++) {
                let tree = document.createElement('div');
                tree.className = 'tree';
                // Випадковий вид дерева для різноманітності
                const treeTypes = ['🌳', '🌲', '🌴'];
                tree.innerText = treeTypes[Math.floor(Math.random() * 2)]; // Тільки листяні і хвойні
                
                tree.onclick = () => cutTree();
                forest.appendChild(tree);
            }
            updateSystem();
        }

        function plantTree() {
            if (state.trees < 10) {
                state.trees++;
                renderTrees();
                showFact(facts[Math.floor(Math.random() * facts.length)]);
            } else {
                showFact("Максимальна щільність лісу досягнута для цієї ділянки! Екосистема стабільна.");
            }
        }

        function cutTree() {
            if (state.trees > 0) {
                state.trees--;
                renderTrees();
                showFact("Зрубано 1 гектар лісу. Здатність регіону фільтрувати повітря знизилась.");
            }
        }

        function showFact(text) {
            const box = document.getElementById('fact-box');
            document.getElementById('fact-text').innerText = text;
            box.style.display = 'block';
            
            // Сховати через 8 секунд
            setTimeout(() => {
                box.style.display = 'none';
            }, 8000);
        }

        // Постійне збільшення викидів з часом (щоб змушувати гравця діяти)
        setInterval(() => {
            if(Math.random() > 0.7) {
                state.co2Emissions += 5; 
                updateSystem();
                if(state.co2Emissions > 150) {
                    showFact("🏭 Промисловість зростає! Рівень базових викидів збільшився. Потрібно більше дерев!");
                }
            }
        }, 5000);

        // Ініціалізація
        renderTrees();
    </script>
</body>
</html>
