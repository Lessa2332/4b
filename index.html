<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Літосфера AR: Горсти та Грабени 🏔️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; font-family: 'Quicksand', sans-serif; background: #0a1f2e; }

        #video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; transform: scaleX(-1);
        }
        #canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* зірки прогресу */
        #stars-bar {
            position: absolute; top: 16px; right: 16px;
            z-index: 150; display: flex; gap: 12px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            padding: 8px 18px; border-radius: 50px;
        }
        .star-icon {
            font-size: 2.5rem; opacity: 0.3;
            transition: all 0.3s ease;
        }
        .star-icon.earned { opacity: 1; filter: drop-shadow(0 0 10px gold); transform: scale(1.2); }

        /* картка знання */
        #info-card {
            position: absolute; inset: 0; z-index: 2000;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
        }
        .card {
            background: linear-gradient(135deg, #fff9e8, #ffefc0);
            border-radius: 60px; padding: 30px 40px;
            text-align: center; max-width: 85%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .card h2 { font-size: 2.5rem; color: #2d4c1e; margin: 15px 0; }
        .card p { font-size: 1.3rem; color: #2c3e2b; }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        #status-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            border-radius: 60px; padding: 16px 24px;
            text-align: center; z-index: 100;
            border: 1px solid #ffd966;
        }
        #instruction-text {
            font-size: 1.4rem; font-weight: bold; color: #ffecb3;
        }
        #mimic-hint {
            font-size: 1rem; color: #ddd; margin-top: 6px;
        }

        #face-bubble {
            position: absolute; z-index: 1000;
            background: #ff7b2c; color: white;
            border-radius: 60px; padding: 8px 18px;
            font-size: 1.6rem; font-weight: bold;
            display: none; align-items: center; gap: 12px;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 3px solid #fff;
        }
        #face-bubble.correct { background: #2ecc71; }

        #start-screen, #win-screen {
            position: fixed; inset: 0; z-index: 3000;
            background: radial-gradient(circle at 20% 30%, #1e4b2e, #0a2f1a);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: white; gap: 20px;
        }
        button {
            background: #f7b32b; border: none; padding: 16px 40px;
            font-size: 1.8rem; font-weight: bold; border-radius: 50px;
            color: #2c3e2b; cursor: pointer; box-shadow: 0 8px 0 #a55d00;
            font-family: inherit;
        }
        button:active { transform: translateY(5px); box-shadow: 0 3px 0 #a55d00; }
        h1 { font-size: 2.5rem; text-shadow: 2px 2px 0 #1f3b1a; }
    </style>
</head>
<body>

    <div id="stars-bar">
        <span class="star-icon" id="star0">🌟</span>
        <span class="star-icon" id="star1">🌟</span>
        <span class="star-icon" id="star2">🌟</span>
        <span class="star-icon" id="star3">🌟</span>
        <span class="star-icon" id="star4">🌟</span>
    </div>

    <div id="info-card">
        <div class="card">
            <div style="font-size: 4rem;" id="card-icon">🏔️</div>
            <h2 id="card-title">Горст</h2>
            <p id="card-desc">Центральний блок піднявся вгору — утворився горст</p>
        </div>
    </div>

    <div id="status-bar">
        <div id="instruction-text">😠 Нахмур брови → ГОРСТ &nbsp;|&nbsp; 😲 Відкрий рот → ГРАБЕН</div>
        <div id="mimic-hint">🎯 Спробуй!</div>
    </div>

    <div id="face-bubble">😐</div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="start-screen">
        <div style="font-size: 5rem;">🌋🏞️</div>
        <h1>Досліджуй літосферу!</h1>
        <p style="font-size:1.3rem;">Керуй мімікою — створюй <b>горсти</b> та <b>грабени</b></p>
        <button id="start-btn">Розпочати</button>
    </div>

    <div id="win-screen" style="display:none;">
        <div style="font-size:5rem;">🏆🎉</div>
        <h1>Ти справжній геолог!</h1>
        <p>Ти опанував розривні рухи земної кори</p>
        <button onclick="location.reload()">Грати знову</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        // ---------- Елементи UI ----------
        const video = document.getElementById('video');
        const instructionEl = document.getElementById('instruction-text');
        const mimicHint = document.getElementById('mimic-hint');
        const faceBubble = document.getElementById('face-bubble');
        const infoCard = document.getElementById('info-card');
        const cardTitle = document.getElementById('card-title');
        const cardDesc = document.getElementById('card-desc');
        const cardIcon = document.getElementById('card-icon');

        let faceLandmarker;
        let scene, camera, renderer, blocksGroup, centerBlock, leftBlock, rightBlock;
        let arrowUp, arrowDown;
        let currentVertical = 0;
        let targetVertical = 0;
        
        // Прогрес гравця
        let level = 0;          // 0..4 (5 рівнів)
        let isWaiting = false;
        let confirmFrames = 0;
        let lastGesture = "none";
        
        // Параметри міміки (оновлюються з landmarks)
        let browFurrow = 0;      // нахмурення (0..1)
        let mouthOpen = 0;       // відкриття рота (0..1)
        
        // Калібрування нейтрального стану
        let neutralBrowDist = 0.06;
        let neutralMouthDist = 0.02;
        let calibrated = false;
        
        // Рівні навчання
        const lessons = [
            { name: "ГОРСТ", desc: "Центральний блок піднявся – це горст. Виникає при стисненні.", icon: "🏔️", target: "brow" },
            { name: "ГРАБЕН", desc: "Центральний блок опустився – це грабен. Виникає при розтягуванні.", icon: "🌊", target: "mouth" },
            { name: "ГОРСТ (повторення)", desc: "Знову горст – блок угору!", icon: "⛰️", target: "brow" },
            { name: "ГРАБЕН (повторення)", desc: "Ще раз грабен – блок униз", icon: "🏞️", target: "mouth" },
            { name: "Супер-тест", desc: "Чергуй горст і грабен! Але зараз покажи ГОРСТ", icon: "🎓", target: "brow" }
        ];
        
        // Функція для голосового супроводу
        function speak(text, onEnd) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'uk-UA';
            utterance.rate = 0.9;
            if (onEnd) utterance.onend = onEnd;
            window.speechSynthesis.speak(utterance);
        }
        
        // Оновлення зірок
        function updateStars() {
            for (let i = 0; i < 5; i++) {
                const star = document.getElementById(`star${i}`);
                if (i < level) star.classList.add('earned');
                else star.classList.remove('earned');
            }
        }
        
        // Показати картку знання
        function showLessonCard(lessonIndex) {
            const l = lessons[lessonIndex];
            cardIcon.textContent = l.icon;
            cardTitle.textContent = l.name;
            cardDesc.textContent = l.desc;
            infoCard.style.display = 'flex';
            speak(l.name + ". " + l.desc, () => {
                setTimeout(() => {
                    infoCard.style.display = 'none';
                }, 2000);
            });
        }
        
        // Успішне виконання рівня
        function advanceLevel() {
            if (isWaiting) return;
            isWaiting = true;
            
            // Візуальний фідбек
            faceBubble.classList.add('correct');
            setTimeout(() => faceBubble.classList.remove('correct'), 400);
            
            // Запам'ятати поточний рівень, щоб показати картку
            const currentLevel = level;
            showLessonCard(currentLevel);
            
            // Через 3 секунди переходимо до наступного рівня
            setTimeout(() => {
                level++;
                updateStars();
                if (level >= lessons.length) {
                    // Перемога!
                    document.getElementById('win-screen').style.display = 'flex';
                    isWaiting = false;
                    return;
                }
                // Оновити підказку
                const nextLesson = lessons[level];
                if (nextLesson.target === "brow") {
                    instructionEl.innerHTML = "😠 НАХМУР БРОВИ, щоб підняти блок → ГОРСТ";
                } else {
                    instructionEl.innerHTML = "😲 ВІДКРИЙ РОТА, щоб опустити блок → ГРАБЕН";
                }
                mimicHint.textContent = nextLesson.desc;
                speak(`Рівень ${level+1}. ${nextLesson.name}`);
                isWaiting = false;
                // Скидаємо підтвердження
                confirmFrames = 0;
                lastGesture = "none";
                targetVertical = 0;
            }, 2800);
        }
        
        // ---------- 3D сцена: горст / грабен ----------
        function createTexturedBlock(w, h, d, color, posX, posY, posZ) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#daa06a';
            ctx.lineWidth = 20;
            for (let i = 1; i <= 10; i++) {
                const y = (i / 10) * canvas.height;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                ctx.stroke();
                ctx.fillStyle = '#b97f44';
                ctx.fillRect(0, y-5, canvas.width, 5);
            }
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, material);
            mesh.position.set(posX, posY, posZ);
            mesh.castShadow = true;
            return mesh;
        }
        
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1f2e);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
            camera.position.set(0, 1.2, 5.5);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), alpha: false, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            
            // освітлення
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const mainLight = new THREE.DirectionalLight(0xfff5cc, 1);
            mainLight.position.set(2, 3, 2);
            mainLight.castShadow = true;
            scene.add(mainLight);
            const fillLight = new THREE.PointLight(0x88aaff, 0.5);
            fillLight.position.set(-1, 1, 2);
            scene.add(fillLight);
            
            // група блоків
            blocksGroup = new THREE.Group();
            scene.add(blocksGroup);
            
            const leftW = 1.6, rightW = 1.6, centerW = 1.4;
            const h = 1.2, d = 2.2;
            const leftX = -(leftW/2 + centerW/2 + 0.1);
            const rightX = (rightW/2 + centerW/2 + 0.1);
            const baseY = -0.2;
            
            leftBlock = createTexturedBlock(leftW, h, d, '#7c6a58', leftX, baseY, 0);
            rightBlock = createTexturedBlock(rightW, h, d, '#7c6a58', rightX, baseY, 0);
            centerBlock = createTexturedBlock(centerW, h, d, '#c69454', 0, baseY, 0);
            blocksGroup.add(leftBlock, rightBlock, centerBlock);
            
            // червоні лінії розломів
            const faultMat = new THREE.LineBasicMaterial({ color: 0xff4444 });
            const leftLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-1.45, -0.8, -1.3), new THREE.Vector3(-1.45, 0.9, -1.3),
                new THREE.Vector3(-1.45, 0.9, 1.3), new THREE.Vector3(-1.45, -0.8, 1.3)
            ]), faultMat);
            const rightLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(1.45, -0.8, -1.3), new THREE.Vector3(1.45, 0.9, -1.3),
                new THREE.Vector3(1.45, 0.9, 1.3), new THREE.Vector3(1.45, -0.8, 1.3)
            ]), faultMat);
            blocksGroup.add(leftLine, rightLine);
            
            // стрілочки
            const arrowUpGeo = new THREE.ConeGeometry(0.2, 0.5, 8);
            const arrowUpMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff5500 });
            arrowUp = new THREE.Mesh(arrowUpGeo, arrowUpMat);
            arrowUp.position.set(0, 0.7, 1.2);
            arrowUp.rotation.x = 0;
            
            const arrowDownGeo = new THREE.ConeGeometry(0.2, 0.5, 8);
            const arrowDownMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x3377ff });
            arrowDown = new THREE.Mesh(arrowDownGeo, arrowDownMat);
            arrowDown.position.set(0, 0.7, 1.2);
            arrowDown.rotation.x = Math.PI;
            blocksGroup.add(arrowUp, arrowDown);
            arrowUp.visible = false; arrowDown.visible = false;
            
            // декоративні частки
            const particles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xccaa77, size: 0.04 }));
            blocksGroup.add(particles);
        }
        
        function update3D() {
            // плавне переміщення центрального блоку
            currentVertical += (targetVertical - currentVertical) * 0.2;
            centerBlock.position.y = -0.2 + currentVertical;
            
            // показуємо відповідну стрілку
            if (targetVertical > 0.05) {
                arrowUp.visible = true; arrowDown.visible = false;
            } else if (targetVertical < -0.05) {
                arrowUp.visible = false; arrowDown.visible = true;
            } else {
                arrowUp.visible = false; arrowDown.visible = false;
            }
        }
        
        // ---------- Аналіз міміки за допомогою FaceLandmarker ----------
        function computeMimic(landmarks) {
            // ключові точки: брови (70, 300) та верхні повіки (159, 386)
            const leftBrow = landmarks[70];
            const leftEyeTop = landmarks[159];
            const rightBrow = landmarks[300];
            const rightEyeTop = landmarks[386];
            const browDist = (Math.abs(leftBrow.y - leftEyeTop.y) + Math.abs(rightBrow.y - rightEyeTop.y)) / 2;
            
            // рот: 13 (верхня губа), 14 (нижня)
            const upperLip = landmarks[13];
            const lowerLip = landmarks[14];
            const mouthDist = Math.abs(upperLip.y - lowerLip.y);
            
            if (!calibrated && browDist > 0.01 && mouthDist > 0.005) {
                neutralBrowDist = browDist;
                neutralMouthDist = mouthDist;
                calibrated = true;
                mimicHint.textContent = "Калібрування завершено! Тепер міміка працює";
                setTimeout(() => mimicHint.textContent = lessons[level].desc, 1500);
            }
            
            let browIntensity = 0;
            let mouthIntensity = 0;
            if (calibrated) {
                browIntensity = Math.min(1, Math.max(0, (neutralBrowDist - browDist) / neutralBrowDist));
                mouthIntensity = Math.min(1, Math.max(0, (mouthDist - neutralMouthDist) / 0.05));
                if (mouthDist < neutralMouthDist * 0.9) mouthIntensity = 0;
            }
            return { brow: browIntensity, mouth: mouthIntensity };
        }
        
        // ---------- Основний цикл FaceLandmarker ----------
        async function initFaceAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1,
                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: false
            });
            
            // Запуск детекції в реальному часі
            function detect() {
                if (!faceLandmarker || !video.videoWidth) {
                    requestAnimationFrame(detect);
                    return;
                }
                const startTime = performance.now();
                const result = faceLandmarker.detectForVideo(video, startTime);
                if (result.faceLandmarks && result.faceLandmarks.length > 0) {
                    const lm = result.faceLandmarks[0];
                    const mimic = computeMimic(lm);
                    
                    // Оновлення бульбашки та горизонтального положення (для веселощів)
                    const nose = lm[1];
                    const xPos = (1 - nose.x) * 100;
                    const yPos = nose.y * 100;
                    faceBubble.style.left = `${xPos}%`;
                    faceBubble.style.top = `${yPos}%`;
                    faceBubble.style.display = 'flex';
                    
                    // Визначаємо жест
                    let gesture = "none";
                    let newTarget = 0;
                    if (mimic.brow > 0.35 && mimic.mouth < 0.2) {
                        gesture = "brow";
                        newTarget = 0.7;
                        faceBubble.innerHTML = "😠 ГОРСТ ↑";
                    } else if (mimic.mouth > 0.4 && mimic.brow < 0.2) {
                        gesture = "mouth";
                        newTarget = -0.8;
                        faceBubble.innerHTML = "😲 ГРАБЕН ↓";
                    } else {
                        gesture = "none";
                        newTarget = 0;
                        faceBubble.innerHTML = "😐";
                    }
                    
                    targetVertical = newTarget;
                    update3D();
                    
                    // Логіка перевірки рівня (якщо не в режимі очікування)
                    if (!isWaiting && level < lessons.length) {
                        const required = lessons[level].target;
                        if (required === "brow" && gesture === "brow") {
                            confirmFrames++;
                            if (confirmFrames > 18) {  // ~0.6 секунди стабільного жесту
                                advanceLevel();
                                confirmFrames = 0;
                            }
                        } else if (required === "mouth" && gesture === "mouth") {
                            confirmFrames++;
                            if (confirmFrames > 18) {
                                advanceLevel();
                                confirmFrames = 0;
                            }
                        } else {
                            confirmFrames = Math.max(0, confirmFrames - 2);
                        }
                    }
                } else {
                    faceBubble.style.display = 'none';
                    if (!isWaiting) targetVertical = 0;
                }
                requestAnimationFrame(detect);
            }
            detect();
        }
        
        // ---------- Запуск камери та 3D ----------
        async function startApp() {
            document.getElementById('start-screen').style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                await video.play();
                init3D();
                await initFaceAI();
                
                // Анімаційний цикл Three.js
                function animate3D() {
                    requestAnimationFrame(animate3D);
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                }
                animate3D();
                
                // Початковий голос
                speak("Привіт! Покажи нахмурені брови, щоб зробити горст. Відкрий рот для грабена.");
                instructionEl.innerHTML = "😠 НАХМУР БРОВИ → ГОРСТ &nbsp;|&nbsp; 😲 ВІДКРИЙ РОТА → ГРАБЕН";
                mimicHint.textContent = lessons[0].desc;
            } catch (err) {
                alert("Потрібен дозвіл на камеру!");
                console.error(err);
            }
        }
        
        document.getElementById('start-btn').onclick = startApp;
        
        // Підлаштування розміру
        window.addEventListener('resize', () => {
            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        });
    </script>
</body>
</html>
