<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25 Еко-Місій: Класний проект 🌍</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0984e3; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 10px; margin: 20px 0; }
        button { padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-num { background: #55efc4; }
        .mission-panel { background: white; color: #2d3436; padding: 25px; border-radius: 20px; max-width: 500px; width: 90%; text-align: center; }
        .choice-btn { background: #fab1a0; margin: 5px; width: 100%; }
        .success { color: #00b894; font-weight: bold; }
        .fail { color: #ff7675; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌍 Еко-Експедиція: 25 викликів</h1>
    <div class="grid" id="grid"></div>
    <div class="mission-panel" id="panel" style="display:none;">
        <h2 id="m-title"></h2>
        <p id="m-desc"></p>
        <div id="choices"></div>
        <p id="feedback"></p>
    </div>

<script>
const missions = [
    { title: "Місія 1", desc: "Видобуток піску з річки.", good: "Використати еко-технології.", bad: "Знищити русло.", feed: "Річка зберегла екосистему!" },
    { title: "Місія 2", desc: "Сміття в лісі.", good: "Сортування.", bad: "Спалити.", feed: "Ліс чистий!" },
    { title: "Місія 3", desc: "Старі батарейки.", good: "Здати на утилізацію.", bad: "Викинути в смітник.", feed: "Ґрунт не отруєно!" },
    { title: "Місія 4", desc: "Використання пластику.", good: "Еко-торба.", bad: "Пластиковий пакет.", feed: "Океан чистіший!" },
    { title: "Місія 5", desc: "Будівництво дороги.", good: "Еко-перехід для звірів.", bad: "Знищити тропу.", feed: "Тварини в безпеці!" },
    { title: "Місія 6", desc: "Відходи заводу.", good: "Система очистки.", bad: "Скид у воду.", feed: "Риба врятована!" },
    { title: "Місія 7", desc: "Полив полів.", good: "Крапельний полив.", bad: "Залити все водою.", feed: "Воду заощаджено!" },
    { title: "Місія 8", desc: "Опалення.", good: "Тепловий насос.", bad: "Спалювання шин.", feed: "Повітря свіже!" },
    { title: "Місія 9", desc: "Міське освітлення.", good: "LED-лампи.", bad: "Залишити старі лампи.", feed: "Енергію збережено!" },
    { title: "Місія 10", desc: "Дерева в місті.", good: "Зелені дахи.", bad: "Асфальт.", feed: "Місто стало прохолоднішим!" },
    { title: "Місія 11", desc: "Полювання.", good: "Фотополювання.", bad: "Браконьєрство.", feed: "Вид врятовано!" },
    { title: "Місія 12", desc: "Вибір авто.", good: "Електрокар.", bad: "Дизель.", feed: "Вихлопів немає!" },
    { title: "Місія 13", desc: "Папір.", good: "Переробка.", bad: "Вирубка.", feed: "Ліс росте!" },
    { title: "Місія 14", desc: "Добрива.", good: "Органіка.", bad: "Хімія.", feed: "Земля родюча!" },
    { title: "Місія 15", desc: "Вода вдома.", good: "Еко-фільтр.", bad: "Пластикові пляшки.", feed: "Менше пластику!" },
    { title: "Місія 16", desc: "Забруднення моря.", good: "Прибирання пляжу.", bad: "Залишити бруд.", feed: "Пляж чистий!" },
    { title: "Місія 17", desc: "Освіта.", good: "Урок екології.", bad: "Ігнорувати тему.", feed: "Діти знають як рятувати світ!" },
    { title: "Місія 18", desc: "Мило/Побутова хімія.", good: "Біорозкладні засоби.", bad: "Фосфати.", feed: "Річка не цвіте!" },
    { title: "Місія 19", desc: "Одяг.", good: "Секонд-хенд/Вінтаж.", bad: "Купувати одноразовий одяг.", feed: "Мода стала етичною!" },
    { title: "Місія 20", desc: "Відпочинок в лісі.", good: "Забрати сміття.", bad: "Лишити багаття.", feed: "Ліс не згорів!" },
    { title: "Місія 21", desc: "Енергія.", good: "Сонячні панелі.", bad: "Спалювати вугілля.", feed: "Чиста енергія!" },
    { title: "Місія 22", desc: "Міграція птахів.", good: "Годівниці.", bad: "Не чіпати.", feed: "Птахи ситі!" },
    { title: "Місія 23", desc: "Вибір продуктів.", good: "Місцеве виробництво.", bad: "Імпорт літаком.", feed: "Менше викидів CO2!" },
    { title: "Місія 24", desc: "Транспорт.", good: "Велосипед.", bad: "Авто в пробці.", feed: "Здоров'я і чистота!" },
    { title: "Місія 25", desc: "Ставлення до природи.", good: "Любити і берегти.", bad: "Споживати.", feed: "Ти — Еко-Герой!" }
];

const grid = document.getElementById('grid');
missions.forEach((m, i) => {
    let btn = document.createElement('button');
    btn.className = 'btn-num'; btn.innerText = i + 1;
    btn.onclick = () => load(i);
    grid.appendChild(btn);
});

function load(i) {
    document.getElementById('panel').style.display = 'block';
    document.getElementById('m-title').innerText = missions[i].title;
    document.getElementById('m-desc').innerText = missions[i].desc;
    document.getElementById('feedback').innerText = "";
    document.getElementById('choices').innerHTML = `
        <button class="choice-btn" onclick="res(true, ${i})">🟢 ${missions[i].good}</button>
        <button class="choice-btn" onclick="res(false, ${i})">🔴 ${missions[i].bad}</button>
    `;
}

function res(ok, i) {
    document.getElementById('feedback').innerHTML = ok ? 
        `<span class="success">✅ ПЕРЕМОГА: ${missions[i].feed}</span>` : 
        `<span class="fail">❌ ПОМИЛКА: Екосистема постраждала.</span>`;
}
</script>
</body>
</html>
