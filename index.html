<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Географія AR: Тектоніка</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    #app-container { position: relative; width: 100vw; height: 100vh; }
    #webgl-canvas { display: block; width: 100%; height: 100%; outline: none; }
    
    #video-feed { position: absolute; bottom: 16px; right: 16px; width: 100px; border-radius: 12px; transform: scaleX(-1); border: 2px solid rgba(255,255,255,0.1); z-index: 10; opacity: 0.6; display: none; }
    
    .ui-panel { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { margin: 0 0 4px 0; font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    p { margin: 0 0 10px 0; font-size: 0.8rem; color: #94a3b8; }
    
    .status { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 99px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; transition: all 0.3s ease; }
    .status.collision { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .status.rift { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .status.loading { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }

    /* ЕКРАН СТАРТУ */
    #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #start-btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 99px; margin-top: 20px; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.js"
      }
    }
  </script>
</head>
<body>
  <div id="start-screen">
    <h1>Тектонічна Лабораторія</h1>
    <p style="text-align: center; max-width: 80%; margin-top: 10px;">Надай доступ до камери, щоб керувати літосферними плитами за допомогою міміки.</p>
    <button id="start-btn">ПОЧАТИ УРОК</button>
  </div>

  <div id="app-container">
    <div class="ui-panel">
      <h1>Стан платформи:</h1>
      <div id="status-badge" class="status loading">Очікування...</div>
    </div>
    
    <video id="video-feed" autoplay playsinline muted></video>
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
