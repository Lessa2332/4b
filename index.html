<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Рівень 5: Активація | Квест-гра</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-blue: #0066ff;
      --bg-dark-blue: #0044cc;
      --gold-yellow: #FFE600;
      --neon-green: #39FF14;
      --text-white: #ffffff;
      --font-main: 'Montserrat', sans-serif;
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: var(--font-main);
      background: var(--bg-blue);
      /* Текстурований глянцевий фон, як на вашій картці */
      background: radial-gradient(circle at 50% 50%, var(--bg-blue) 0%, var(--bg-dark-blue) 100%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Веселі фонові елементи (іконки) */
    .bg-elements {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="40" r="4" fill="white" opacity="0.15"/><path d="M10 10 L20 20 M70 10 L60 20" stroke="white" stroke-width="2" opacity="0.1"/></svg>');
      pointer-events: none;
      z-index: -1;
    }
    
    h1 {
      font-weight: 900;
      font-size: 28px;
      color: var(--gold-yellow);
      text-align: center;
      margin-bottom: 5px;
      text-shadow: 0 4px 0px rgba(0,0,0,0.3);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .subtitle {
      text-align: center;
      color: var(--text-white);
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.9;
    }
    
    /* ІГРОВИЙ БОКС */
    .scanner-box {
      background: #0055ff;
      border: 6px solid var(--text-white);
      border-radius: 40px;
      padding: 25px 20px;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 20px 0px rgba(0, 0, 68, 0.4);
      text-align: center;
      position: relative;
    }

    /* БЛОК ВВОДУ ІМЕНІ */
    .input-group {
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--gold-yellow);
      text-transform: uppercase;
    }

    .name-input {
      width: 100%;
      padding: 15px 20px;
      font-family: var(--font-main);
      font-size: 18px;
      font-weight: 700;
      border: 4px solid var(--text-white);
      border-radius: 25px;
      background: #0044cc;
      color: var(--text-white);
      text-align: center;
      outline: none;
      box-shadow: inset 0 5px 0px rgba(0,0,0,0.2);
    }

    .name-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    /* СКАНЕР ВІДБИТКУ ПАЛЬЦЯ */
    .scan-area {
      width: 180px;
      height: 180px;
      margin: 15px auto;
      border: 6px solid var(--neon-green);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      background: radial-gradient(circle, #0033aa 40%, #001166 100%);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Ефект блокування сканера, поки не ввели ім'я */
    .scan-area.disabled {
      opacity: 0.3;
      border-color: #777;
      cursor: not-allowed;
      pointer-events: none;
    }
    
    .fingerprint-img {
      width: 65%;
      height: 65%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .scan-area:not(.disabled):hover .fingerprint-img {
      transform: scale(1.1);
    }
    
    .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green), 0 0 30px var(--neon-green);
      animation: scan 2s linear infinite;
      display: none;
      z-index: 10;
    }
    
    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
    
    .scan-area.scanning {
      box-shadow: 0 0 40px var(--neon-green);
      border-color: var(--text-white);
    }

    .scan-area.scanning .scan-line {
      display: block;
    }
    
    .tap-hint {
      color: var(--text-white);
      font-size: 13px;
      font-weight: 700;
      margin-top: 10px;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    
    /* РЕЗУЛЬТАТИ ТА ПОВІДОМЛЕННЯ */
    #message {
      font-size: 16px;
      font-weight: 700;
      margin-top: 15px;
      min-height: 25px;
    }
    
    #skillDisplay {
      font-size: 22px;
      font-weight: 900;
      margin: 10px 0;
      color: var(--gold-yellow);
      text-shadow: 0 2px 0px rgba(0,0,0,0.5);
      min-height: 35px;
    }
    
    /* КНОПКИ */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }
    
    .btn {
      padding: 14px 28px;
      background: #ff3366;
      border: 4px solid var(--text-white);
      color: var(--text-white);
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      border-radius: 25px;
      box-shadow: 0 6px 0px #cc0033;
    }
    
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #cc0033;
    }
    
    .btn-gold {
      background: var(--gold-yellow);
      color: #0044cc;
      box-shadow: 0 6px 0px #cda600;
    }

    .btn-gold:active {
      box-shadow: 0 2px 0px #cda600;
    }
    
    @media (max-width: 400px) {
      h1 { font-size: 24px; }
      .scan-area { width: 150px; height: 150px; }
      .btn { padding: 12px 20px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="bg-elements"></div>

  <h1>🚀 РІВЕНЬ 5: АКТИВОВАНО! 🚀</h1>
  <div class="subtitle">Вхід у базу даних п'ятикласників</div>

  <div class="scanner-box">
    <div class="input-group" id="inputGroup">
      <label for="userName">Введи своє ім'я </label>
      <input type="text" id="userName" class="name-input" placeholder="Наприклад: Максим Іванов" oninput="checkInput()">
    </div>

    <div class="scan-area disabled" id="scanArea" onclick="startScan()" ontouchstart="startScan()">
      <div id="scanLine" class="scan-line"></div>
      <svg class="fingerprint-img" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 14.22 2.73 16.28 3.97 17.94C4.26 18.33 4.81 18.41 5.2 18.12C5.59 17.83 5.67 17.28 5.38 16.89C4.35 15.51 3.75 13.82 3.75 12C3.75 7.44 7.44 3.75 12 3.75C16.56 3.75 20.25 7.44 20.25 12C20.25 13.01 20.07 14 19.73 14.93C19.58 15.36 19.8 15.83 20.23 15.98C20.66 16.13 21.13 15.91 21.28 15.48C21.75 14.22 22 12.88 22 12C22 6.48 17.52 2 12 2Z" fill="%2339FF14"/>
        <path d="M12 6C8.69 6 6 8.69 6 12C6 13.46 6.52 14.81 7.39 15.86C7.67 16.2 8.19 16.24 8.53 15.96C8.87 15.68 8.91 15.16 8.63 14.82C7.94 13.99 7.5 12.95 7.5 12C7.5 9.51 9.51 7.5 12 7.5C14.49 7.5 16.5 9.51 16.5 12C16.5 13.41 15.82 14.65 14.79 15.42C14.42 15.7 14.35 16.22 14.63 16.59C14.91 16.96 15.43 17.03 15.8 16.75C17.18 15.72 18 14.07 18 12C18 8.69 15.31 6 12 6Z" fill="%2339FF14"/>
        <path d="M12 10C10.9 10 10 10.9 10 12C10 13.25 10.66 14.36 11.64 14.81C11.96 14.96 12.35 14.77 12.48 14.43C12.61 14.09 12.43 13.7 12.09 13.57C11.49 13.29 11.25 12.68 11.25 12C11.25 11.59 11.59 11.25 12 11.25C12.41 11.25 12.75 11.59 12.75 12C12.75 13.1 13.65 14 14.75 14C15.16 14 15.5 13.66 15.5 13.25C15.5 12.84 15.16 12.5 14.75 12.5C14.47 12.5 14.25 12.28 14.25 12C14.25 10.9 13.35 10 12 10Z" fill="%2339FF14"/>
      </svg>
    </div>
    
    <div class="tap-hint" id="tapHint">Заповни поле з ім'ям вгорі 👆</div>
    
    <div id="message"></div>
    <div id="skillDisplay"></div>
    
    <div class="btn-group">
      <button class="btn" onclick="resetScan()" id="resetBtn" style="display: none;">Ще раз</button>
      <a href="game.html" class="btn btn-gold" id="startGameBtn" style="display: none;">СТАРТ ГРИ 🎮</a>
    </div>
  </div>

  <audio id="scanSound">
    <source src="https://assets.mixkit.co/sfx/download/mixkit-scanning-sci-fi-alarm-905.wav" type="audio/wav" />
  </audio>

  <script>
    // ============ СУПЕРСИЛИ П'ЯТИКЛАСНИКІВ ============
    const SKILLS = [
      { name: '🦾 Мега-мозок математики', бонус: 'Швидкість розв’язування задач x2!' },
      { name: '🧭 Майстер географічних мандрів', бонус: 'Ніколи не заблукаєш у кабінетах!' },
      { name: '⚡ Генератор геніальних ідей', бонус: 'Твої проєкти здивують усю школу!' },
      { name: '🛡️ Захисник класної дружби', бонус: 'Твоя суперсила — єднати друзів!' },
      { name: '🚀 Космічний лідер', бонус: 'Упевнено ведеш команду за собою!' },
      { name: '🎨 Креативний ніндзя', бонус: 'Вмієш малювати шедеври на берегах!' },
      { name: '📚 Хранитель шкільних таємниць', бонус: 'Знаєш відповіді на всі запитання!' },
      { name: '🎭 Суперзірка перерв', бонус: 'Вмієш піднімати настрій усьому класу!' }
    ];
    
    const scanArea = document.getElementById('scanArea');
    const tapHint = document.getElementById('tapHint');
    const nameInput = document.getElementById('userName');
    const messageEl = document.getElementById('message');
    const skillDisplay = document.getElementById('skillDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const startGameBtn = document.getElementById('startGameBtn');
    const sound = document.getElementById('scanSound');
    
    let scanTimer = null;

    // Перевірка введення імені для розблокування сканера
    function checkInput() {
      if (nameInput.value.trim().length >= 3) {
        scanArea.classList.remove('disabled');
        tapHint.innerHTML = '👆 Приклади палець для верифікації!';
        tapHint.style.color = 'var(--neon-green)';
      } else {
        scanArea.classList.add('disabled');
        tapHint.innerHTML = "Заповни поле з ім'ям вгорі 👆";
        tapHint.style.color = 'var(--text-white)';
      }
    }
    
    // Запуск сканування
    function startScan() {
      if (scanArea.classList.contains('disabled') || scanArea.classList.contains('scanning')) return;
      
      // Сховуємо старі результати та інпут під час сканування
      resetBtn.style.display = 'none';
      startGameBtn.style.display = 'none';
      skillDisplay.innerHTML = '';
      document.getElementById('inputGroup').style.opacity = '0.5';
      nameInput.disabled = true;
      
      scanArea.classList.add('scanning');
      messageEl.innerHTML = '<span style="color: var(--text-white);">🧬 Сканування відбитку... Аналіз ДНК-скілів</span>';
      tapHint.innerHTML = 'Тримай палець! 🤖';
      
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.log('Потрібна взаємодія для звуку'));
      }
      
      if (scanTimer) clearTimeout(scanTimer);
      
      // Сканування триває 3 секунди
      scanTimer = setTimeout(() => {
        scanArea.classList.remove('scanning');
        document.getElementById('inputGroup').style.opacity = '1';
        
        // Отримуємо рандомну суперсилу
        const randomSkill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
        const studentName = nameInput.value.trim();
        
        // Вивід крутого результату
        messageEl.innerHTML = `<span style="color: var(--neon-green);">✅ ВЕРИФІКАЦІЮ ПРОЙДЕНО!</span><br><small style="color:#aaa">${studentName} успішно доданий(а) в 5-й клас</small>`;
        skillDisplay.innerHTML = `<div style="font-size:14px; color:var(--text-white); font-weight:400; margin-bottom:5px;">ТВОЯ СУПЕРСИЛА:</div>${randomSkill.name}<br><span style="font-size:14px; font-weight:bold; color:var(--neon-green)">${randomSkill.бонус}</span>`;
        
        tapHint.innerHTML = '⚡ Скіл розблоковано! Спробуй гру!';
        
        // Зберігаємо ім'я та силу в локальну пам'ять, щоб використати всередині самої гри
        localStorage.setItem('pysanka_student_name', studentName);
        localStorage.setItem('pysanka_student_skill', randomSkill.name);
        
        resetBtn.style.display = 'inline-block';
        startGameBtn.style.display = 'inline-block';
        
        if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
      }, 3000);
    }
    
    // Скидання
    function resetScan() {
      scanArea.classList.remove('scanning');
      messageEl.innerHTML = '';
      skillDisplay.innerHTML = '';
      resetBtn.style.display = 'none';
      startGameBtn.style.display = 'none';
      nameInput.disabled = false;
      nameInput.value = '';
      checkInput();
      if (scanTimer) clearTimeout(scanTimer);
    }
  </script>
</body>
</html>
